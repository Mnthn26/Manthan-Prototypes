        <!-- MAIN CONTENT -->
        <main class="main-content">
            
            <div class="page-header">
                <h1 class="page-title">DeskTech Broadcast Feed</h1>
                <p class="page-subtitle">Dynamic tracking pipeline updating automatically with video uploads from the DeskTech node stream.</p>
            </div>

            <div class="content-grid" id="youtube-feed-grid">
                <div class="content-card" style="padding: 24px; border-style: dashed; align-items: center; justify-content: center; min-height: 200px;">
                    <h3 style="color: var(--text-tertiary); font-family: var(--font-mono);">Connecting to feed stream...</h3>
                </div>
            </div>
            
        </main>
    </div>

    <script>
        const channelId = 'UCJ097-h2m6bMtl9oHYCZjIQ';
        const feedContainer = document.getElementById('youtube-feed-grid');

        async function syncDeskTechVideos() {
            try {
                const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=https://www.youtube.com/feeds/videos.xml?channel_id=${channelId}`);
                if (!response.ok) throw new Error('Data drop');
                
                const data = await response.json();
                feedContainer.innerHTML = '';

                if (!data.items || data.items.length === 0) {
                    feedContainer.innerHTML = `<p style="font-family: var(--font-mono); color: var(--text-muted);">No feed broadcasts detected.</p>`;
                    return;
                }

                data.items.forEach(item => {
                    const videoId = item.link.split('v=')[1] || item.guid.split('video:')[1];
                    if (!videoId) return;

                    const videoCard = document.createElement('div');
                    videoCard.className = 'content-card';

                    videoCard.innerHTML = `
                        <div class="video-frame-wrapper" style="position: relative; padding-top: 56.25%; width: 100%; background: #000; border-bottom: 1px solid var(--border-color);">
                            <iframe style="position: absolute; top: 0; left: 0; width: 100%; height: 100%;" 
                                src="https://www.youtube.com/embed/${videoId}" 
                                title="${item.title}" 
                                frameborder="0" 
                                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                                allowfullscreen>
                            </iframe>
                        </div>
                        <div style="padding: 24px; display: flex; flex-direction: column; flex: 1;">
                            <h3 style="font-size: 1rem; color: var(--text-primary); margin-bottom: 16px; line-height: 1.4;">${item.title}</h3>
                            <a href="${item.link}" target="_blank" rel="noopener noreferrer" style="margin-top: auto; font-family: var(--font-mono); color: var(--accent-primary); font-size: 0.85rem; text-decoration: none; display: flex; align-items: center; gap: 6px; transition: var(--transition);">
                                Watch on YouTube 
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>
                            </a>
                        </div>
                    `;
                    feedContainer.appendChild(videoCard);
                });

            } catch (error) {
                console.error(error);
                feedContainer.innerHTML = `<p style="color: #ef4444;">Failed to parse streaming feed items.</p>`;
            }
        }
        document.addEventListener('DOMContentLoaded', syncDeskTechVideos);
    </script>
