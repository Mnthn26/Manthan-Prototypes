    <main class="container">

    <script>
        const githubUsername = 'mnthn26';
        const projectGrid = document.getElementById('github-project-grid');

        async function loadGitHubProjects() {
            try {
                const response = await fetch(`https://api.github.com/users/${githubUsername}/repos?sort=updated&per_page=12`);
                if (!response.ok) throw new Error('Data drop');
                
                const repos = await response.json();
                projectGrid.innerHTML = '';

                repos.forEach(repo => {
                    if (repo.fork) return;

                    const card = document.createElement('div');
                    card.className = 'project-card dynamic';
                    
                    let tagText = repo.language ? repo.language : 'Hardware';
                    if (repo.name.toLowerCase().includes('arduino') || repo.name.toLowerCase().includes('radar')) {
                        tagText = 'Arduino / C++';
                    }

                    card.innerHTML = `
                        <h3>${repo.name}</h3>
                        <p>${repo.description || 'Hardware blueprints and design resources live within this active lab repository.'}</p>
                        <div class="tech-tag-wrapper">
                            <span class="tech-tag">${tagText}</span>
                        </div>
                        <a href="${repo.html_url}" target="_blank" rel="noopener noreferrer" class="repo-access-link">
                            Source Files →
                        </a>
                    `;
                    projectGrid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                projectGrid.innerHTML = `<p>Failed to parse active repository sets.</p>`;
            }
        }
        document.addEventListener('DOMContentLoaded', loadGitHubProjects);
    </script>
